name: Legacy DNS migration VMs

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'valet'
      - 'composer.json'
      - 'composer.lock'
      - 'tests/vm/**'
      - '.github/workflows/vm.yml'
  schedule:
    # Weekly, to notice replaced images and package changes in the distributions.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# A new push to the same pull request supersedes the running matrix.
concurrency:
  group: vm-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  vm:
    name: ${{ matrix.distro }} / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upgrade from the original release, migrate, roll back, migrate again.
          - { distro: ubuntu-26.04, scenario: legacy }
          - { distro: ubuntu-24.04, scenario: legacy }
          - { distro: debian-13, scenario: legacy }
          - { distro: fedora-44, scenario: legacy }
          - { distro: almalinux-10, scenario: legacy }
          - { distro: arch, scenario: legacy }
          - { distro: opensuse-leap-16.0, scenario: legacy }
          # Older layouts and edge cases need one distribution each.
          - { distro: ubuntu-26.04, scenario: legacy-watcher }
          - { distro: ubuntu-26.04, scenario: legacy-user-dnsmasq }
          - { distro: ubuntu-26.04, scenario: legacy-uninstalled }
          # A fresh install must leave DNS alone everywhere. ALT has no
          # original installer, so this is its only scenario.
          - { distro: ubuntu-26.04, scenario: fresh }
          - { distro: ubuntu-24.04, scenario: fresh }
          - { distro: debian-13, scenario: fresh }
          - { distro: fedora-44, scenario: fresh }
          - { distro: almalinux-10, scenario: fresh }
          - { distro: arch, scenario: fresh }
          - { distro: opensuse-leap-16.0, scenario: fresh }
          - { distro: alt-p11, scenario: fresh }
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
      - name: Cache pinned image
        uses: actions/cache@v4
        with:
          path: ~/.cache/valet-vm
          key: vm-image-${{ matrix.distro }}-${{ hashFiles('tests/vm/images.sh') }}
      - name: Run scenario
        run: tests/vm/run.sh ${{ matrix.distro }} ${{ matrix.scenario }}
      - name: Summarize
        if: always()
        run: |
          result=tests/vm/.work/${{ matrix.distro }}-${{ matrix.scenario }}/artifacts/result.tsv
          if [ ! -f "$result" ]; then
            echo "| ${{ matrix.distro }} | ${{ matrix.scenario }} | fail | no result |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' "$result" >> "$GITHUB_STEP_SUMMARY"
          # A gap (image gone, platform cannot reach the scenario) is reported, not hidden.
          if grep -qP '\tgap\t' "$result"; then
            echo "::warning title=VM gap::$(cut -f4 "$result")"
          fi
          ! grep -qP '\t(fail|running)\t' "$result"
      - name: Upload logs and state diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.distro }}-${{ matrix.scenario }}
          path: tests/vm/.work/${{ matrix.distro }}-${{ matrix.scenario }}/artifacts
          if-no-files-found: warn
