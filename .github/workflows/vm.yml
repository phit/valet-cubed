name: Legacy DNS migration VMs

on:
  pull_request:
  workflow_dispatch:

jobs:
  vm:
    name: ${{ matrix.distro }} / ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        distro: [ubuntu-26.04, ubuntu-24.04, debian-13, fedora-44, almalinux-10, arch, opensuse-leap-16.0, alt-p11, solus]
        scenario: [legacy, legacy-watcher, legacy-user-dnsmasq, legacy-uninstalled, fresh]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
      - name: Cache pinned image
        uses: actions/cache@v4
        with:
          path: ~/.cache/valet-vm
          key: vm-image-${{ matrix.distro }}-${{ hashFiles('tests/vm/images.sh') }}
      - name: Run scenario
        run: tests/vm/run.sh ${{ matrix.distro }} ${{ matrix.scenario }}
      - name: Summarize
        if: always()
        run: |
          result=tests/vm/.work/${{ matrix.distro }}-${{ matrix.scenario }}/artifacts/result.tsv
          if [ -f "$result" ]; then
            awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}' "$result" >> "$GITHUB_STEP_SUMMARY"
            ! grep -qP '\t(fail|running)\t' "$result"
          else
            echo "| ${{ matrix.distro }} | ${{ matrix.scenario }} | fail | no result |" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload logs and state diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.distro }}-${{ matrix.scenario }}
          path: tests/vm/.work/${{ matrix.distro }}-${{ matrix.scenario }}/artifacts
          if-no-files-found: warn
